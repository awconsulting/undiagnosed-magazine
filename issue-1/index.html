<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undiagnosed Magazine</title>
<meta name="description" content="A free digital magazine for the undiagnosed and the chronically ill. Read it right here, no download, no email.">
<meta property="og:title" content="Undiagnosed, Issue One">
<meta property="og:description" content="Still Here, Still Undiagnosed. Read it free, right in your browser.">
<meta property="og:image" content="https://undiagnosedmagazine.com/assets/cover.jpg">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F2F2F4;color:#0B0B0C;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top);background:#0B0B0C}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#FFFFFF;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
@media (max-width:440px){.brand{font-size:13px;letter-spacing:.1em}.brand .mg{display:none}a.hbtn{display:none !important}.hbtn{padding:0 13px}}
.brand i{width:9px;height:9px;border-radius:50%;background:#D70015;display:block}
.hbtn{appearance:none;border:1px solid #E4E4E9;background:#FFFFFF;color:#0B0B0C;height:40px;padding:0 16px;border-radius:999px;font:700 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:#0B0B0C}
header .hbtn{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.35)}
header .hbtn:hover{border-color:#FFFFFF}
main{position:relative;flex:1 1 auto;overflow:hidden;touch-action:pan-y}
#track{position:absolute;inset:0;display:flex;will-change:transform}
.slot{flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:var(--gap)}
.pg{position:relative;flex:none;overflow:hidden;background:#FFFFFF;box-shadow:0 2px 14px rgba(0,0,0,.10);border-radius:4px}
.pg iframe{position:absolute;left:0;top:0;width:1080px;height:1440px;border:0;transform-origin:0 0;background:#FFFFFF}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #E4E4E9;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.nav:hover{border-color:#0B0B0C}
.nav[disabled]{opacity:.3;cursor:default}
#prev{left:12px}#next{right:12px}
@media (max-width:700px){.nav{display:none}}
footer{flex:none;background:#FFFFFF;border-top:1px solid #E4E4E9;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
#count{font-weight:700;font-size:14px;min-width:78px;white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:#D70015;height:28px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#0B0B0C;color:#FFFFFF;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;white-space:nowrap;z-index:4;transition:opacity .5s;pointer-events:none}
#toc{position:fixed;inset:0;z-index:10;background:rgba(11,11,12,.35);display:none}
#toc.open{display:block}
#toc .sheet{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#FFFFFF;overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:-6px 0 30px rgba(0,0,0,.12)}
#toc h2{margin:0 0 4px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D70015}
#toc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#toc button.row{appearance:none;display:flex;gap:16px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #E4E4E9;padding:15px 2px;cursor:pointer;font:600 17px/1.3 Inter,sans-serif;color:#0B0B0C}
#toc button.row:hover{color:#D70015}
#toc button.row span{flex:none;width:34px;font-weight:800;color:#D70015;font-variant-numeric:tabular-nums}

.pgw{position:relative;flex:none}
.tab{position:absolute;right:-12px;top:22px;min-width:30px;height:34px;padding:0 8px;border-radius:0 8px 8px 0;background:#D70015;color:#FFFFFF;font:800 13px Inter,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 8px rgba(0,0,0,.25);cursor:pointer;z-index:2;border:0}
#notes{position:fixed;inset:0;z-index:11;background:rgba(11,11,12,.35);display:none}
#notes.open{display:block}
#notes .sheet{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:#FFFFFF;display:flex;flex-direction:column;box-shadow:-6px 0 30px rgba(0,0,0,.12)}
#notes .head{padding:18px 20px 14px;border-bottom:1px solid #E4E4E9;display:flex;justify-content:space-between;align-items:center;gap:10px}
#notes h2{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D70015}
#notes .compose{padding:16px 20px;border-bottom:1px solid #E4E4E9;background:#FAFAFB}
#notes .compose label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
#notes textarea{width:100%;min-height:92px;border:1px solid #D1D1D6;border-radius:12px;padding:12px;font:500 16px/1.45 Inter,sans-serif;color:#0B0B0C;resize:vertical;background:#FFFFFF}
#notes textarea:focus{outline:2px solid #D70015;border-color:transparent}
.btnr{appearance:none;border:0;background:#D70015;color:#FFFFFF;height:44px;padding:0 20px;border-radius:999px;font:800 15px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.list{flex:1;overflow:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
.empty{color:#6E6E73;font:500 15px/1.5 Inter,sans-serif;padding:18px 0}
.note{border:1px solid #E4E4E9;border-top:4px solid #D70015;border-radius:12px;padding:14px 14px 10px;margin:14px 0;background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.note .skind{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:4px;font:800 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#1C1C1E;vertical-align:1px}
.note .pgl{appearance:none;border:0;background:none;padding:0;font:800 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D70015;cursor:pointer}
.note blockquote{margin:10px 0 0;padding:0 0 0 12px;border-left:3px solid #0B0B0C;font:500 15px/1.5 'Source Serif 4',Georgia,serif;color:#2C2C2E}
.note p{margin:10px 0 0;font:500 15px/1.5 Inter,sans-serif;color:#0B0B0C;white-space:pre-wrap}
.note .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:nowrap;overflow-x:auto}
.note .acts button{appearance:none;border:1px solid #E4E4E9;background:#FFFFFF;border-radius:999px;height:34px;padding:0 12px;font:700 13px Inter,sans-serif;color:#0B0B0C;cursor:pointer;white-space:nowrap}
.note .acts button:hover{border-color:#0B0B0C}
.note .acts.mail{margin-top:8px;padding-top:10px;border-top:1px dashed #E4E4E9}
.note .acts.mail[hidden]{display:none}
.note .acts.mail button{background:#F4F4F6}
.note .acts button.warn{background:#D70015;border-color:#D70015;color:#FFFFFF}
#savebar{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:none}
#savebar.show{display:block}
#savebar button{box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0B0B0C;color:#FFFFFF;font:700 14px Inter,sans-serif;padding:10px 16px;border-radius:999px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.foot-note{font:500 12px/1.5 Inter,sans-serif;color:#6E6E73;padding:10px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #E4E4E9}

footer{gap:12px}
.pager{display:flex;align-items:center;gap:6px}
.arrow{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid #E4E4E9;background:#FFFFFF;color:#0B0B0C;display:flex;align-items:center;justify-content:center;cursor:pointer}
.arrow:hover{border-color:#0B0B0C}.arrow[disabled]{opacity:.3;cursor:default}
#count{min-width:auto;text-align:center;padding:0 4px}
.fbtn{appearance:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:1px solid #E4E4E9;background:#FFFFFF;color:#0B0B0C;font:700 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.fbtn:hover{border-color:#0B0B0C}
.seg{display:flex;border:1px solid #E4E4E9;border-radius:999px;padding:3px;flex:none}
.seg button{appearance:none;border:0;background:none;height:36px;padding:0 14px;border-radius:999px;font:700 13px Inter,sans-serif;color:#3A3A3C;cursor:pointer;white-space:nowrap}
.seg button.on{background:#0B0B0C;color:#FFFFFF}
@media (max-width:700px){input[type=range]{display:none}footer{justify-content:space-between}.seg{display:none}.fbtn span{display:none}.fbtn{width:44px;padding:0;justify-content:center}}
#pages{position:fixed;inset:0;z-index:11;background:rgba(11,11,12,.35);display:none}
#pages.open{display:block}
#pages .sheet{position:absolute;left:0;top:0;bottom:0;width:min(380px,100%);background:#FFFFFF;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.12)}
#pages .head{padding:18px 20px 14px;border-bottom:1px solid #E4E4E9;display:flex;justify-content:space-between;align-items:center}
#pages h2{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D70015}
.grid{flex:1;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;align-content:start}
@media (max-width:700px){#pages .sheet{width:100%}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.th{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:center;font:700 12px Inter,sans-serif;color:#3A3A3C}
.th{display:block;width:100%}
.th .box{display:block;position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#F2F2F4;box-shadow:0 1px 4px rgba(0,0,0,.15);outline:3px solid transparent;outline-offset:2px}
.th.cur .box{outline-color:#D70015}
.th.cur{color:#D70015}
.th iframe{position:absolute;left:0;top:0;width:1080px;height:1440px;border:0;transform-origin:0 0;pointer-events:none}
.th .lbl{display:block;margin-top:6px}
.th .dot{position:absolute;right:4px;top:4px;min-width:18px;height:18px;border-radius:9px;background:#D70015;color:#FFFFFF;font:800 10px/18px Inter,sans-serif;padding:0 4px;z-index:1}

/* sticky notes */
.stk-layer{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:2}
.stk{position:absolute;pointer-events:auto;background:var(--c);border-radius:3px 3px 3px 14px;box-shadow:0 10px 22px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.18);transform:rotate(var(--r,-1.5deg));display:flex;flex-direction:column;touch-action:none}
.stk::after{content:"";position:absolute;left:0;bottom:0;width:18%;height:14%;max-width:26px;max-height:26px;background:linear-gradient(45deg,rgba(0,0,0,.14) 50%,transparent 50%);border-radius:0 0 0 14px}
.stk .bar{flex:none;height:30px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 4px;cursor:grab;background:rgba(0,0,0,.06);border-radius:3px 3px 0 0}
.stk .bar:active{cursor:grabbing}
.stk .grip{margin-right:auto;margin-left:6px;width:22px;height:10px;background:radial-gradient(circle,rgba(0,0,0,.35) 1.4px,transparent 1.6px) 0 0/6px 5px;opacity:.7}
.stk .bar button{appearance:none;border:0;background:rgba(255,255,255,.55);width:24px;height:24px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font:800 14px/1 Inter,sans-serif;color:#0B0B0C}
.stk .bar button.del.warn{width:auto;padding:0 9px;border-radius:999px;background:#D70015;color:#FFFFFF;font-size:12px}
.stk .bar .cdot{background:conic-gradient(#FFE45C 0 20%,#FF9EC7 0 40%,#8FD3FF 0 60%,#A8E6A1 0 80%,#FFB26B 0);border:2px solid rgba(255,255,255,.8)}
.stk textarea{flex:1;width:100%;border:0;background:transparent;resize:none;padding:6px 10px 14px;font:600 var(--fs,15px)/1.35 Inter,sans-serif;color:#1C1C1E;outline:none}
.stk textarea::placeholder{color:rgba(0,0,0,.45)}
@media (max-width:700px){#openStk{margin-right:auto}.stk .bar{height:38px}.stk .bar button{width:32px;height:32px;font-size:17px}.stk .bar button.del.warn{font-size:13px}#stkTray{left:12px;right:12px}#stkTray .sw{justify-content:space-between}#stkTray .sw button{width:48px;height:48px}}
#stkTray{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:9;background:#FFFFFF;border:1px solid #E4E4E9;border-radius:18px;padding:14px 16px;box-shadow:0 12px 34px rgba(0,0,0,.18);display:none}
#stkTray.open{display:block}
#stkTray p{margin:0 0 10px;font:800 13px Inter,sans-serif;white-space:nowrap}
#stkTray .sw{display:flex;gap:10px}
#stkTray .sw button{appearance:none;width:44px;height:44px;border-radius:10px 10px 10px 4px;border:2px solid rgba(0,0,0,.08);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15)}
#stkTray .sw button:hover{transform:translateY(-2px)}
.fbtn .sq{width:18px;height:18px;border-radius:3px 3px 3px 7px;background:#FFE45C;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><i></i>Undiagnosed<span class="mg">&nbsp;Magazine</span></a>
  <div style="display:flex;gap:8px">
    <button class="hbtn" id="openNotes" type="button">Notes</button>
    <button class="hbtn" id="openToc" type="button">Contents</button>
    <a class="hbtn" href="/" style="display:inline-flex;align-items:center;text-decoration:none">Home</a>
  </div>
</header>
<main id="stage">
  <div id="track"></div>
  <button class="nav" id="prev" type="button" aria-label="Previous page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="nav" id="next" type="button" aria-label="Next page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="hint">Swipe to turn the page</div>
</main>
<footer>
  <button class="fbtn" id="openPages" type="button" aria-label="See all pages"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Pages</span></button>
  <button class="fbtn" id="openStk" type="button" aria-label="Add a sticky note"><i class="sq"></i><span>Sticky note</span></button>
  <div class="pager">
    <button class="arrow" id="fprev" type="button" aria-label="Previous page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span id="count">1 / 162</span>
    <button class="arrow" id="fnext" type="button" aria-label="Next page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <label for="scrub" style="position:absolute;left:-9999px">Go to page</label>
  <input type="range" id="scrub" min="1" max="162" value="1">
  <div class="seg" role="group" aria-label="Pages at once">
    <button type="button" data-mode="1" aria-label="One page">1 page</button>
    <button type="button" data-mode="2" aria-label="Two pages">2 pages</button>
  </div>
</footer>
<div id="toc" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="Contents">
    <div class="top"><h2>Issue One · Contents</h2><button class="hbtn" id="closeToc" type="button">Close</button></div>
    <div id="tocList"></div>
  </div>
</div>
<div id="pages" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="All pages">
    <div class="head"><h2>All 162 pages</h2><button class="hbtn" id="closePages" type="button">Close</button></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div id="notes" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="My notes">
    <div class="head"><h2>My notes</h2><button class="hbtn" id="closeNotes" type="button">Close</button></div>
    <div class="compose">
      <label for="noteText" id="noteLabel">Add a note to page 1</label>
      <textarea id="noteText" placeholder="Write it down so you don’t lose it."></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btnr" id="addNote" type="button">Save note</button></div>
    </div>
    <div class="list" id="noteList"></div>
    <div class="foot-note">Notes and sticky notes save on this device automatically. Tip: highlight any line in the magazine to save it here.</div>
  </div>
</div>
<div id="stkTray" role="dialog" aria-label="Sticky note color"><p>Pick a color for your sticky note</p><div class="sw" id="stkSw"></div></div>
<div id="savebar"><button class="btnr" id="saveSel" type="button">Save highlight to notes</button></div>
<div id="toast"></div>
<script>

(function(){
var N=162, W=1080, H=1440, cur=1, spread=false, slots=[], busy=false;
var track=document.getElementById('track'), stage=document.getElementById('stage');
var countEl=document.getElementById('count'), scrub=document.getElementById('scrub');
function pad(n){return ('00'+n).slice(-3)}
function url(n){return 'p/'+pad(n)+'.html'}
var mode='auto'; try{mode=localStorage.getItem('und-view')||'auto'}catch(e){}
function isSpread(){ if(mode==='1')return false; if(mode==='2')return true; return stage.clientWidth>=900 && stage.clientWidth/stage.clientHeight>1.25}
// which pages make the view that contains page n
function view(n){
  if(!spread) return [n];
  if(n<=1) return [1];
  if(n>=N) return [N];
  var a=(n%2===0)?n:n-1; var b=a+1;
  return b>=N?[a]:[a,b];
}
function step(dir){
  var v=view(cur);
  if(dir>0){var last=v[v.length-1]; return last<N?last+1:null}
  var first=v[0]; return first>1?first-1:null;
}
function scale(){
  var pad=spread?28:14, gap=spread?6:0;
  var aw=stage.clientWidth-pad*2, ah=stage.clientHeight-pad*2;
  var cols=spread?2:1;
  return Math.min((aw-gap*(cols-1))/(W*cols), ah/H);
}
function makePage(n,s){
  var d=document.createElement('div'); d.className='pg';
  d.style.width=Math.round(W*s)+'px'; d.style.height=Math.round(H*s)+'px';
  var f=document.createElement('iframe'); f.title='Page '+n; f.loading='eager';
  f.style.transform='scale('+s+')'; f.src=url(n);
  f.addEventListener('load',function(){hookFrame(f)});
  d.appendChild(f);
  var w=document.createElement('div'); w.className='pgw'; w.dataset.page=n; w.appendChild(d);
  var L=document.createElement('div'); L.className='stk-layer'; w.appendChild(L);
  notes.forEach(function(x){if(x.kind==='sticky'&&x.page===n)L.appendChild(stickyEl(x,Math.round(W*s)))});
  setTab(w,n);
  return w;
}
function makeSlot(n){
  var s=scale(); var el=document.createElement('div'); el.className='slot';
  el.style.setProperty('--gap',(spread?6:0)+'px');
  if(n!==null){view(n).forEach(function(p){el.appendChild(makePage(p,s))})}
  return el;
}
function render(){
  spread=isSpread();
  track.style.transition='none';
  track.innerHTML='';
  var p=step(-1), nx=step(1);
  slots=[makeSlot(p),makeSlot(cur),makeSlot(nx)];
  slots.forEach(function(sl){track.appendChild(sl)});
  track.style.width='300%';
  slots.forEach(function(sl){sl.style.width=(100/3)+'%'});
  track.style.transform='translateX(-33.3333%)';
  ui();
}
function ui(){
  var v=view(cur);
  countEl.textContent=(v.length>1?v[0]+'–'+v[1]:v[0])+' / '+N;
  scrub.value=cur;
  document.getElementById('prev').disabled=step(-1)===null;
  document.getElementById('next').disabled=step(1)===null;
  document.getElementById('fprev').disabled=step(-1)===null;document.getElementById('fnext').disabled=step(1)===null;
  try{history.replaceState(null,'','#'+cur)}catch(e){}
  markThumbs();
}
function go(dir){
  if(busy)return; var t=step(dir); if(t===null){snap();return}
  busy=true;
  track.style.transition='transform .32s cubic-bezier(.2,.7,.2,1)';
  track.style.transform='translateX('+(dir>0?'-66.6667%':'0%')+')';
  setTimeout(function(){
    cur=t;
    track.style.transition='none';
    if(dir>0){ track.removeChild(slots[0]); slots.shift(); var nx=step(1); var sl=makeSlot(nx); sl.style.width=(100/3)+'%'; track.appendChild(sl); slots.push(sl); }
    else { track.removeChild(slots[2]); slots.pop(); var p=step(-1); var sl=makeSlot(p); sl.style.width=(100/3)+'%'; track.insertBefore(sl,track.firstChild); slots.unshift(sl); }
    track.style.transform='translateX(-33.3333%)';
    busy=false; ui();
  },330);
}
function snap(){track.style.transition='transform .25s ease';track.style.transform='translateX(-33.3333%)'}
function jump(n){n=Math.max(1,Math.min(N,n|0));cur=n;render();}
window.addEventListener('message',function(e){if(e.data&&e.data.goto){jump(e.data.goto)}});
document.getElementById('prev').onclick=function(){go(-1)};
document.getElementById('next').onclick=function(){go(1)};
scrub.addEventListener('input',function(){countEl.textContent=scrub.value+' / '+N});
scrub.addEventListener('change',function(){jump(+scrub.value)});
document.addEventListener('keydown',function(e){
  var tg=(e.target&&e.target.tagName)||''; if(tg==='TEXTAREA'||tg==='INPUT'){if(e.key==='Escape'){closeNotes()}return}
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
  else if(e.key==='Escape'){closeToc();closeNotes();closePages()}
});
// swipe: listen on the stage and inside each same-origin page
var sx=0,sy=0,dx=0,dragging=false,locked=null;
function tStart(x,y){if(busy)return;sx=x;sy=y;dx=0;dragging=true;locked=null;track.style.transition='none'}
function tMove(x,y,ev){
  if(!dragging)return; dx=x-sx; var dy=y-sy;
  if(locked===null&&(Math.abs(dx)>8||Math.abs(dy)>8)){locked=Math.abs(dx)>Math.abs(dy)?'x':'y'}
  if(locked==='x'){ if(ev&&ev.cancelable)ev.preventDefault(); var w=stage.clientWidth; track.style.transform='translateX(calc(-33.3333% + '+dx+'px))'; }
}
function tEnd(){
  if(!dragging)return; dragging=false;
  if(locked==='x'){ var th=Math.min(90,stage.clientWidth*.18); if(dx<-th)go(1); else if(dx>th)go(-1); else snap(); }
}
function bind(t){
  t.addEventListener('touchstart',function(e){var p=e.touches[0];tStart(p.clientX,p.clientY)},{passive:true});
  t.addEventListener('touchmove',function(e){var p=e.touches[0];tMove(p.clientX,p.clientY,e)},{passive:false});
  t.addEventListener('touchend',tEnd);t.addEventListener('touchcancel',tEnd);
}
bind(stage);
function hookFrame(f){
  try{ var d=f.contentDocument; if(!d||d.__hooked)return; d.__hooked=true; bind(d);
    var sel=function(){var t=(d.getSelection()||'').toString().trim(); pending=t?{text:t.slice(0,1200),page:parseInt(f.title.replace('Page ',''),10)}:null; document.getElementById('savebar').classList.toggle('show',!!pending)};
    d.addEventListener('selectionchange',sel); d.addEventListener('mouseup',sel); d.addEventListener('touchend',function(){setTimeout(sel,50)});
    d.addEventListener('keydown',function(e){if(['ArrowRight','ArrowLeft','PageDown','PageUp',' '].indexOf(e.key)>-1){e.preventDefault();go(e.key==='ArrowLeft'||e.key==='PageUp'?-1:1)}});
  }catch(e){}
}
// notes
var KEY='und-issue1-notes', notes=[], pending=null;
try{notes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){notes=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
function notesOn(n){return notes.filter(function(x){return x.page===n}).length}
var notesEl=document.getElementById('notes');
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0},1800)}
function copyText(t,msg){function fb(){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:-1000px;opacity:0';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);toast(ok?msg:'Select the note text to copy it')}
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast(msg)},fb)}else fb()}
function openMail(u){var w=null;try{w=window.open(u,'_blank')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){location.href=u}}}
function openNotes(){document.getElementById('noteLabel').textContent='Add a note to page '+view(cur)[0];renderNotes();notesEl.classList.add('open');notesEl.setAttribute('aria-hidden','false')}
function closeNotes(){notesEl.classList.remove('open');notesEl.setAttribute('aria-hidden','true')}
function pageUrl(n){return location.origin+location.pathname+'#'+n}
function noteText(x){return (x.quote?'“'+x.quote+'”\n':'')+(x.text?x.text+'\n':'')+'Undiagnosed Magazine, Issue One, page '+x.page+'\n'+pageUrl(x.page)}
function renderNotes(){
  var box=document.getElementById('noteList'); box.innerHTML='';
  if(!notes.length){var e=document.createElement('div');e.className='empty';e.textContent='No notes yet. Write one above, or highlight a line on any page and tap “Save highlight to notes.”';box.appendChild(e);return}
  notes.slice().sort(function(a,b){return a.page-b.page||a.t-b.t}).forEach(function(x){
    var c=document.createElement('div');c.className='note';
    var pl=document.createElement('button');pl.type='button';pl.className='pgl';pl.textContent='Page '+x.page+' →';pl.title='Go to page '+x.page;pl.onclick=function(){closeNotes();jump(x.page)};c.appendChild(pl);
    if(x.kind==='sticky'){c.style.borderTopColor=x.color;c.style.background='linear-gradient(#FFFFFF,#FFFFFF) padding-box';var sl=document.createElement('span');sl.className='skind';sl.style.background=x.color;sl.textContent='Sticky';pl.after(sl)}
    if(x.quote){var q=document.createElement('blockquote');q.textContent=x.quote;c.appendChild(q)}
    if(x.text){var p=document.createElement('p');p.textContent=x.text;c.appendChild(p)}else if(x.kind==='sticky'){var p2=document.createElement('p');p2.style.color='#6E6E73';p2.textContent='Blank sticky. Tap the page number to go write on it.';c.appendChild(p2)}
    var a=document.createElement('div');a.className='acts';
    function btn(l,fn){var b=document.createElement('button');b.type='button';b.textContent=l;b.onclick=fn;a.appendChild(b)}
    btn('Copy',function(){copyText(noteText(x),'Copied')});
    btn('Send',function(){var t=noteText(x);if(navigator.share){navigator.share({title:'Undiagnosed Magazine',text:t}).catch(function(e){if(!e||e.name!=='AbortError')copyText(t,'Copied. Paste it into a text or DM.')})}else{copyText(t,'Copied. Paste it into a text or DM.')}});
    var em=document.createElement('div');em.className='acts mail';em.hidden=true;
    btn('Email myself',function(){em.hidden=!em.hidden;if(!em.hidden)em.scrollIntoView({block:'nearest',behavior:'smooth'})});
    btn('Delete',function(){var b=this;if(b.dataset.arm){notes=notes.filter(function(y){return y!==x});persist();renderNotes();render();toast('Note deleted');return}
      b.dataset.arm='1';b.textContent='Tap again to delete';b.classList.add('warn');setTimeout(function(){if(b.isConnected){delete b.dataset.arm;b.textContent='Delete';b.classList.remove('warn')}},3000)});
    var subj='My note from Undiagnosed Magazine, page '+x.page, body=noteText(x);
    function mb(l,fn){var b=document.createElement('button');b.type='button';b.textContent=l;b.onclick=fn;em.appendChild(b)}
    mb('Gmail',function(){window.open('https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body),'_blank','noopener')});
    mb('Outlook',function(){window.open('https://outlook.live.com/mail/0/deeplink/compose?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body),'_blank','noopener')});
    mb('Yahoo',function(){window.open('https://compose.mail.yahoo.com/?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body),'_blank','noopener')});
    mb('Mail app',function(){openMail('mailto:?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body))});
    c.appendChild(a);c.appendChild(em);box.appendChild(c);
  });
}
document.getElementById('openNotes').onclick=openNotes;
document.getElementById('closeNotes').onclick=closeNotes;
notesEl.addEventListener('click',function(e){if(e.target===notesEl)closeNotes()});
document.getElementById('addNote').onclick=function(){
  var ta=document.getElementById('noteText'),v=ta.value.trim(); if(!v){ta.focus();return}
  notes.push({id:Date.now()+'',page:view(cur)[0],text:v,quote:'',t:Date.now()}); persist(); ta.value=''; renderNotes(); render(); toast('Note saved');
};

var COLORS=['#FFE45C','#FF9EC7','#8FD3FF','#A8E6A1','#FFB26B'], CNAMES=['Yellow','Pink','Blue','Green','Orange'];
function setTab(w,n){var t=w.querySelector('.tab');var c=notes.filter(function(x){return x.page===n&&x.kind!=='sticky'}).length;
  if(!c){if(t)t.remove();return}
  if(!t){t=document.createElement('button');t.type='button';t.className='tab';t.onclick=function(){openNotes()};w.appendChild(t)}
  t.textContent=c;t.setAttribute('aria-label',c+' note'+(c>1?'s':'')+' on page '+n)}
function refreshPage(n){document.querySelectorAll('.pgw[data-page="'+n+'"]').forEach(function(w){setTab(w,n)});markThumbs()}
function stickyEl(x,pw){
  var el=document.createElement('div');el.className='stk';el.dataset.id=x.id;
  var sw=Math.max(160,Math.round(pw*.34)), sh=Math.round(sw*.92);
  el.style.width=sw+'px';el.style.height=sh+'px';el.style.left=(x.x*100)+'%';el.style.top=(x.y*100)+'%';
  el.style.setProperty('--c',x.color);el.style.setProperty('--r',(x.rot||-1.5)+'deg');el.style.setProperty('--fs',Math.max(16,Math.round(sw/12))+'px');
  var bar=document.createElement('div');bar.className='bar';
  var grip=document.createElement('span');grip.className='grip';bar.appendChild(grip);
  var cb=document.createElement('button');cb.type='button';cb.className='cdot';cb.title='Change color';cb.setAttribute('aria-label','Change color');
  cb.onclick=function(){var i=(COLORS.indexOf(x.color)+1)%COLORS.length;x.color=COLORS[i];persist();syncSticky(x)};bar.appendChild(cb);
  var db=document.createElement('button');db.type='button';db.className='del';db.textContent='×';db.setAttribute('aria-label','Delete sticky note');
  db.onclick=function(){if(x.text.trim()&&!db.dataset.arm){db.dataset.arm='1';db.textContent='Delete?';db.classList.add('warn');setTimeout(function(){if(db.isConnected){delete db.dataset.arm;db.textContent='×';db.classList.remove('warn')}},3000);return}
    notes=notes.filter(function(y){return y!==x});persist();document.querySelectorAll('.stk[data-id="'+x.id+'"]').forEach(function(e){e.remove()});refreshPage(x.page);if(notesEl.classList.contains('open'))renderNotes()};
  bar.appendChild(db);el.appendChild(bar);
  var ta=document.createElement('textarea');ta.value=x.text||'';ta.placeholder='Write your note…';ta.setAttribute('aria-label','Sticky note on page '+x.page);
  ta.addEventListener('input',function(){x.text=ta.value;x.t=Date.now();persist()});el.appendChild(ta);
  // keep page swipes from firing while using the sticky
  ['touchstart','touchmove','touchend'].forEach(function(ev){el.addEventListener(ev,function(e){e.stopPropagation()},{passive:true})});
  // drag by the top bar
  bar.addEventListener('pointerdown',function(e){
    if(e.target.closest('button'))return; e.preventDefault();
    var layer=el.parentNode, r=layer.getBoundingClientRect(), ox=e.clientX-el.offsetLeft*(r.width/layer.offsetWidth)-r.left, oy=e.clientY-el.offsetTop*(r.height/layer.offsetHeight)-r.top;
    bar.setPointerCapture(e.pointerId);
    function mv(ev){var nx=(ev.clientX-r.left-ox)/r.width, ny=(ev.clientY-r.top-oy)/r.height;
      nx=Math.max(-.04,Math.min(1-el.offsetWidth/layer.offsetWidth+.04,nx));ny=Math.max(0,Math.min(1-el.offsetHeight/layer.offsetHeight,ny));
      x.x=nx;x.y=ny;el.style.left=(nx*100)+'%';el.style.top=(ny*100)+'%'}
    function up(){bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up);persist()}
    bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);
  });
  return el;
}
function syncSticky(x){document.querySelectorAll('.stk[data-id="'+x.id+'"]').forEach(function(e){e.style.setProperty('--c',x.color)})}
var tray=document.getElementById('stkTray'), swBox=document.getElementById('stkSw');
COLORS.forEach(function(c,i){var b=document.createElement('button');b.type='button';b.style.background=c;b.title=CNAMES[i];b.setAttribute('aria-label',CNAMES[i]+' sticky note');b.onclick=function(){addSticky(c)};swBox.appendChild(b)});
document.getElementById('openStk').onclick=function(e){e.stopPropagation();tray.classList.toggle('open')};
document.addEventListener('click',function(e){if(tray.classList.contains('open')&&!tray.contains(e.target))tray.classList.remove('open')});
function addSticky(color){
  tray.classList.remove('open');
  var v=view(cur), n=v[v.length-1];
  var w=slots[1]&&slots[1].querySelector('.pgw[data-page="'+n+'"]'); if(!w)return;
  var L=w.querySelector('.stk-layer'), pw=w.offsetWidth;
  var sw=Math.max(160,Math.round(pw*.34))/pw, sh=sw*.92*.75, k=notes.filter(function(y){return y.kind==='sticky'&&y.page===n}).length%4;
  var spots=[[1-sw-.06,.10],[.06,.34],[1-sw-.10,.52],[.10,.66]], sp=spots[k];
  var x={id:'s'+Date.now(),kind:'sticky',page:n,color:color,text:'',quote:'',x:Math.max(0,sp[0]),y:Math.min(1-sh,sp[1]),rot:[-2,1.5,-1,2.2][k],t:Date.now()};
  notes.push(x);persist();
  var el=stickyEl(x,pw);L.appendChild(el);el.querySelector('textarea').focus({preventScroll:true});
  refreshPage(n);toast('Drag the top of the sticky to move it');
}
document.getElementById('saveSel').onclick=function(){
  if(!pending)return; notes.push({id:Date.now()+'',page:pending.page||view(cur)[0],text:'',quote:pending.text,t:Date.now()}); persist();
  pending=null; document.getElementById('savebar').classList.remove('show'); render(); toast('Saved to your notes');
};
// footer arrows + view mode
document.getElementById('fprev').onclick=function(){go(-1)};
document.getElementById('fnext').onclick=function(){go(1)};
var segs=document.querySelectorAll('.seg button');
function markSeg(){var sp=isSpread();segs.forEach(function(b){b.classList.toggle('on',(b.dataset.mode==='2')===sp)})}
segs.forEach(function(b){b.onclick=function(){mode=b.dataset.mode;try{localStorage.setItem('und-view',mode)}catch(e){}render();markSeg()}});
// pages grid
var pagesEl=document.getElementById('pages'), grid=document.getElementById('grid'), built=false, io=null;
function buildGrid(){
  if(built)return; built=true;
  io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var f=e.target.querySelector('iframe');if(f&&!f.src){f.src=f.dataset.src}io.unobserve(e.target)}})},{root:grid,rootMargin:'400px'}):null;
  for(var i=1;i<=N;i++){(function(n){
    var b=document.createElement('button');b.type='button';b.className='th';b.dataset.page=n;b.setAttribute('aria-label','Go to page '+n);
    var box=document.createElement('span');box.className='box';
    var f=document.createElement('iframe');f.tabIndex=-1;f.title='Page '+n+' preview';f.dataset.src=url(n);f.setAttribute('aria-hidden','true');
    box.appendChild(f);b.appendChild(box);
    var l=document.createElement('span');l.className='lbl';l.textContent=n;b.appendChild(l);
    b.onclick=function(){closePages();jump(n)};
    grid.appendChild(b); if(io)io.observe(b); else f.src=f.dataset.src;
  })(i)}
  sizeThumbs();
}
function sizeThumbs(){var first=grid.querySelector('.box');if(!first)return;var s=first.clientWidth/1080;grid.querySelectorAll('.th iframe').forEach(function(f){f.style.transform='scale('+s+')'})}
function markThumbs(){if(!built)return;var v=view(cur);grid.querySelectorAll('.th').forEach(function(b){var n=+b.dataset.page;b.classList.toggle('cur',v.indexOf(n)>-1);var d=b.querySelector('.dot');var c=notesOn(n);if(c){if(!d){d=document.createElement('span');d.className='dot';b.querySelector('.box').appendChild(d)}d.textContent=c}else if(d){d.remove()}})}
function openPages(){buildGrid();pagesEl.classList.add('open');pagesEl.setAttribute('aria-hidden','false');sizeThumbs();markThumbs();var c=grid.querySelector('.th.cur');if(c)c.scrollIntoView({block:'center'})}
function closePages(){pagesEl.classList.remove('open');pagesEl.setAttribute('aria-hidden','true')}
document.getElementById('openPages').onclick=openPages;
document.getElementById('closePages').onclick=closePages;
pagesEl.addEventListener('click',function(e){if(e.target===pagesEl)closePages()});
// contents
var toc=document.getElementById('toc');
function openToc(){toc.classList.add('open');toc.setAttribute('aria-hidden','false')}
function closeToc(){toc.classList.remove('open');toc.setAttribute('aria-hidden','true')}
document.getElementById('openToc').onclick=openToc;
document.getElementById('closeToc').onclick=closeToc;
toc.addEventListener('click',function(e){if(e.target===toc)closeToc()});
fetch('manifest.json').then(function(r){return r.json()}).then(function(m){
  var box=document.getElementById('tocList');
  m.sections.forEach(function(s){
    var b=document.createElement('button');b.type='button';b.className='row';
    var sp=document.createElement('span');sp.textContent=s[0];b.appendChild(sp);
    b.appendChild(document.createTextNode(s[1].replace("Editor's","Editor’s")));
    b.onclick=function(){closeToc();jump(s[0])}; box.appendChild(b);
  });
});
// start
var start=parseInt(location.hash.slice(1),10);
cur=(start>=1&&start<=N)?start:1;
render();markSeg();
var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){render();markSeg();sizeThumbs()},150)});
setTimeout(function(){document.getElementById('hint').style.opacity=0},2600);
})();
</script>
