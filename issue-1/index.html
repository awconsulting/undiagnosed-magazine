<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undiagnosed Magazine</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><meta name="theme-color" content="#0B0B0C">

<meta property="og:description" content="Still Here, Still Undiagnosed. Read it free, right in your browser.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F2F2F4;color:#0B0B0C;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top);background:#0B0B0C}
.brand{display:flex;flex-direction:column;justify-content:center;gap:3px;text-decoration:none;color:#FFFFFF;white-space:nowrap;text-transform:none;letter-spacing:0}
.brand .wm{font:800 22px/1 Inter,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.035em}
.brand .wm em{font-style:normal;color:#D70015}
.brand .mg{font-weight:600;color:rgba(255,255,255,.62);letter-spacing:-.02em}
.brand small{font:700 11px/1 Inter,sans-serif;color:rgba(255,255,255,.55);letter-spacing:.02em}
@media (max-width:440px){.brand .wm{font-size:20px}.brand .mg{display:none}a.hbtn{display:none !important}.hbtn{padding:0 13px}}
.hbtn{appearance:none;border:1px solid #E4E4E9;background:#FFFFFF;color:#0B0B0C;height:40px;padding:0 16px;border-radius:999px;font:700 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:#0B0B0C}
header .hbtn{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.35)}
header .hbtn:hover{border-color:#FFFFFF}
main{position:relative;flex:1 1 auto;overflow:hidden;touch-action:pan-y}
#track{position:absolute;inset:0;display:flex;will-change:transform}
.slot{flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:var(--gap)}
.pg{position:relative;flex:none;overflow:hidden;background:#FFFFFF;box-shadow:0 2px 14px rgba(0,0,0,.10);border-radius:4px}
.pg iframe{position:absolute;left:0;top:0;width:1080px;height:1440px;border:0;transform-origin:0 0;background:#FFFFFF}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #E4E4E9;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.nav:hover{border-color:#0B0B0C}
.nav[disabled]{opacity:.3;cursor:default}
#prev{left:12px}#next{right:12px}
@media (max-width:700px){.nav{display:none}}
footer{flex:none;background:#FFFFFF;border-top:1px solid #E4E4E9;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
#count{font-weight:700;font-size:14px;min-width:78px;white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:#D70015;height:28px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#0B0B0C;color:#FFFFFF;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;white-space:nowrap;z-index:4;transition:opacity .5s;pointer-events:none}
#toc{position:fixed;inset:0;z-index:10;background:rgba(11,11,12,.35);display:none}
#toc.open{display:block}
#toc .sheet{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#FFFFFF;overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:-6px 0 30px rgba(0,0,0,.12)}
#toc h2{margin:0 0 4px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D70015}
#toc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#toc button.row{appearance:none;display:flex;gap:16px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #E4E4E9;padding:15px 2px;cursor:pointer;font:600 17px/1.3 Inter,sans-serif;color:#0B0B0C}
#toc button.row:hover{color:#D70015}
#toc button.row span{flex:none;width:34px;font-weight:800;color:#D70015;font-variant-numeric:tabular-nums}

.pgw{position:relative;flex:none}
.tab{position:absolute;right:-12px;top:22px;min-width:30px;height:34px;padding:0 8px;border-radius:0 8px 8px 0;background:#D70015;color:#FFFFFF;font:800 13px Inter,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 8px rgba(0,0,0,.25);cursor:pointer;z-index:2;border:0}
#notes{position:fixed;inset:0;z-index:11;background:rgba(11,11,12,.35);display:none}
#notes.open{display:block}
#notes .sheet{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:#FFFFFF;display:flex;flex-direction:column;box-shadow:-6px 0 30px rgba(0,0,0,.12)}
#notes .head{padding:18px 20px 14px;border-bottom:1px solid #E4E4E9;display:flex;justify-content:space-between;align-items:center;gap:10px}
#notes h2{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D70015}
#notes .compose{padding:16px 20px;border-bottom:1px solid #E4E4E9;background:#FAFAFB}
#notes .compose label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
#notes textarea{width:100%;min-height:92px;border:1px solid #D1D1D6;border-radius:12px;padding:12px;font:500 16px/1.45 Inter,sans-serif;color:#0B0B0C;resize:vertical;background:#FFFFFF}
#notes textarea:focus{outline:2px solid #D70015;border-color:transparent}
.btnr{appearance:none;border:0;background:#D70015;color:#FFFFFF;height:44px;padding:0 20px;border-radius:999px;font:800 15px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.list{flex:1;overflow:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
.empty{color:#6E6E73;font:500 15px/1.5 Inter,sans-serif;padding:18px 0}
.note{border:1px solid #E4E4E9;border-top:4px solid #D70015;border-radius:12px;padding:14px 14px 10px;margin:14px 0;background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.note .skind{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:4px;font:800 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#1C1C1E;vertical-align:1px}
.note .pgl{appearance:none;border:0;background:none;padding:0;font:800 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D70015;cursor:pointer}
.note blockquote{margin:10px 0 0;padding:0 0 0 12px;border-left:3px solid #0B0B0C;font:500 15px/1.5 'Source Serif 4',Georgia,serif;color:#2C2C2E}
.note p{margin:10px 0 0;font:500 15px/1.5 Inter,sans-serif;color:#0B0B0C;white-space:pre-wrap}
.note .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:nowrap;overflow-x:auto}
.note .acts button{appearance:none;border:1px solid #E4E4E9;background:#FFFFFF;border-radius:999px;height:34px;padding:0 12px;font:700 13px Inter,sans-serif;color:#0B0B0C;cursor:pointer;white-space:nowrap}
.note .acts button:hover{border-color:#0B0B0C}
.note .acts.mail{margin-top:8px;padding-top:10px;border-top:1px dashed #E4E4E9}
.note .acts.mail[hidden]{display:none}
.note .acts.mail button{background:#F4F4F6}
.note .acts button.warn{background:#D70015;border-color:#D70015;color:#FFFFFF}
#savebar{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:none}
#savebar.show{display:block}
#savebar button{box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0B0B0C;color:#FFFFFF;font:700 14px Inter,sans-serif;padding:10px 16px;border-radius:999px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.foot-note{font:500 12px/1.5 Inter,sans-serif;color:#6E6E73;padding:10px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #E4E4E9}

footer{gap:12px}
.pager{display:flex;align-items:center;gap:6px}
.arrow{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid #E4E4E9;background:#FFFFFF;color:#0B0B0C;display:flex;align-items:center;justify-content:center;cursor:pointer}
.arrow:hover{border-color:#0B0B0C}.arrow[disabled]{opacity:.3;cursor:default}
#count{min-width:auto;text-align:center;padding:0 4px}
.fbtn{appearance:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:1px solid #E4E4E9;background:#FFFFFF;color:#0B0B0C;font:700 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.fbtn:hover{border-color:#0B0B0C}
.seg{display:flex;border:1px solid #E4E4E9;border-radius:999px;padding:3px;flex:none}
.seg button{appearance:none;border:0;background:none;height:36px;padding:0 14px;border-radius:999px;font:700 13px Inter,sans-serif;color:#3A3A3C;cursor:pointer;white-space:nowrap}
.seg button.on{background:#0B0B0C;color:#FFFFFF}
@media (max-width:700px){input[type=range]{display:none}footer{justify-content:space-between}.seg{display:none}.fbtn span{display:none}.fbtn{width:44px;padding:0;justify-content:center}}
#pages{position:fixed;inset:0;z-index:11;background:rgba(11,11,12,.35);display:none}
#pages.open{display:block}
#pages .sheet{position:absolute;left:0;top:0;bottom:0;width:min(380px,100%);background:#FFFFFF;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.12)}
#pages .head{padding:18px 20px 14px;border-bottom:1px solid #E4E4E9;display:flex;justify-content:space-between;align-items:center}
#pages h2{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D70015}
.grid{flex:1;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;align-content:start}
@media (max-width:700px){#pages .sheet{width:100%}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.th{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:center;font:700 12px Inter,sans-serif;color:#3A3A3C}
.th{display:block;width:100%}
.th .box{display:block;position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#F2F2F4;box-shadow:0 1px 4px rgba(0,0,0,.15);outline:3px solid transparent;outline-offset:2px}
.th.cur .box{outline-color:#D70015}
.th.cur{color:#D70015}
.th iframe{position:absolute;left:0;top:0;width:1080px;height:1440px;border:0;transform-origin:0 0;pointer-events:none}
.th .lbl{display:block;margin-top:6px}
.th .dot{position:absolute;right:4px;top:4px;min-width:18px;height:18px;border-radius:9px;background:#D70015;color:#FFFFFF;font:800 10px/18px Inter,sans-serif;padding:0 4px;z-index:1}

/* sticky notes */
.stk-layer{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:2}
.stk{position:absolute;pointer-events:auto;background:var(--c);border-radius:3px 3px 3px 14px;box-shadow:0 10px 22px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.18);transform:rotate(var(--r,-1.5deg));display:flex;flex-direction:column;touch-action:none}
.stk::after{content:"";position:absolute;left:0;bottom:0;width:18%;height:14%;max-width:26px;max-height:26px;background:linear-gradient(45deg,rgba(0,0,0,.14) 50%,transparent 50%);border-radius:0 0 0 14px}
.stk .bar{flex:none;height:30px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 4px;cursor:grab;background:rgba(0,0,0,.06);border-radius:3px 3px 0 0}
.stk .bar:active{cursor:grabbing}
.stk .grip{margin-right:auto;margin-left:6px;width:22px;height:10px;background:radial-gradient(circle,rgba(0,0,0,.35) 1.4px,transparent 1.6px) 0 0/6px 5px;opacity:.7}
.stk .bar button{appearance:none;border:0;background:rgba(255,255,255,.55);width:24px;height:24px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font:800 14px/1 Inter,sans-serif;color:#0B0B0C}
.stk .bar button.del.warn{width:auto;padding:0 9px;border-radius:999px;background:#D70015;color:#FFFFFF;font-size:12px}
.stk .bar .cdot{background:conic-gradient(#FFE45C 0 20%,#FF9EC7 0 40%,#8FD3FF 0 60%,#A8E6A1 0 80%,#FFB26B 0);border:2px solid rgba(255,255,255,.8)}
.stk textarea{flex:1;width:100%;border:0;background:transparent;resize:none;padding:6px 10px 14px;font:600 var(--fs,15px)/1.35 Inter,sans-serif;color:#1C1C1E;outline:none}
.stk textarea::placeholder{color:rgba(0,0,0,.45)}
@media (max-width:700px){#openStk{margin-right:auto}.stk .bar{height:38px}.stk .bar button{width:32px;height:32px;font-size:17px}.stk .bar button.del.warn{font-size:13px}#stkTray{left:12px;right:12px}#stkTray .sw{justify-content:space-between}#stkTray .sw button{width:48px;height:48px}}
#stkTray{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:9;background:#FFFFFF;border:1px solid #E4E4E9;border-radius:18px;padding:14px 16px;box-shadow:0 12px 34px rgba(0,0,0,.18);display:none}
#stkTray.open{display:block}
#stkTray p{margin:0 0 10px;font:800 13px Inter,sans-serif;white-space:nowrap}
#stkTray .sw{display:flex;gap:10px}
#stkTray .sw button{appearance:none;width:44px;height:44px;border-radius:10px 10px 10px 4px;border:2px solid rgba(0,0,0,.08);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15)}
#stkTray .sw button:hover{transform:translateY(-2px)}
.fbtn .sq{width:18px;height:18px;border-radius:3px 3px 3px 7px;background:#FFE45C;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35)}

/* zoom */
#zv{position:absolute;inset:0;z-index:5;background:#F2F2F4;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;display:none;overscroll-behavior:contain}
#zv.open{display:block}
#zv .zin{display:flex;gap:8px;padding:16px;width:max-content;min-width:100%;justify-content:center;transform-origin:0 0}
.zctl{position:absolute;right:12px;top:12px;z-index:6;display:none;align-items:center;gap:4px;background:#FFFFFF;border:1px solid #E4E4E9;border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.zctl.open{display:flex}
.zctl button{appearance:none;border:0;background:none;min-width:40px;height:40px;border-radius:999px;font:800 20px/1 Inter,sans-serif;color:#0B0B0C;cursor:pointer;padding:0 10px;white-space:nowrap}
.zctl button:hover{background:#F2F2F4}
.zctl .zl{font:800 14px Inter,sans-serif;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.zctl .zd{background:#0B0B0C;color:#FFFFFF;font-size:14px;padding:0 16px}
.zctl .zd:hover{background:#2C2C2E}
.fbtn.on{background:#0B0B0C;color:#FFFFFF;border-color:#0B0B0C}

/* v3: highlights, sticky resize + menu, zoom slider */
#savebar{display:none;gap:8px;padding:6px;background:#0B0B0C;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
#savebar.show{display:flex}
#savebar button{box-shadow:none;height:44px;white-space:nowrap}
#savebar .hl{background:#FFD400;color:#0B0B0C}
.stk .rs{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 52%,rgba(0,0,0,.28) 52%,rgba(0,0,0,.28) 60%,transparent 60%,transparent 70%,rgba(0,0,0,.28) 70%,rgba(0,0,0,.28) 78%,transparent 78%);border-radius:0 0 3px 0}
#menu{position:fixed;z-index:30;background:#FFFFFF;border:1px solid #E4E4E9;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:6px;min-width:220px;display:none}
#menu.open{display:block}#menu button.dz{color:#D70015}#undo{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,12px);display:flex;align-items:center;gap:14px;background:#0B0B0C;color:#FFFFFF;font:700 15px Inter,sans-serif;padding:8px 8px 8px 18px;border-radius:999px;z-index:31;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}#undo.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}#undo button{appearance:none;border:0;background:#FFFFFF;color:#0B0B0C;font:800 14px Inter,sans-serif;height:36px;padding:0 16px;border-radius:999px;cursor:pointer}.note{position:relative}.note .trash{position:absolute;top:8px;right:8px;width:40px;height:40px;display:grid;place-items:center;appearance:none;border:0;background:none;border-radius:10px;color:#6E6E73;cursor:pointer}.note .trash:hover{background:#FDECEE;color:#D70015}.note .trash svg{width:20px;height:20px}
#menu button{appearance:none;display:flex;align-items:center;width:100%;height:46px;border:0;background:none;border-radius:10px;padding:0 14px;font:700 15px Inter,sans-serif;color:#0B0B0C;cursor:pointer;text-align:left;white-space:nowrap}
#menu button:hover{background:#F2F2F4}
#menu .sep{height:1px;background:#E4E4E9;margin:4px 8px}
#menu .sub{padding-left:28px;font-weight:600;color:#3A3A3C}
.compose .qprev{margin:0 0 10px;padding:8px 12px;border-left:3px solid #FFD400;background:#FFFBE0;font:500 15px/1.45 'Source Serif 4',Georgia,serif;color:#2C2C2E;border-radius:0 8px 8px 0;max-height:120px;overflow:auto}
.compose .crow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:700 14px Inter,sans-serif;color:#0B0B0C;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.note.flash{animation:fl 1.4s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 4px #FFD400}100%{box-shadow:0 2px 8px rgba(0,0,0,.05)}}
.zctl input[type=range]{width:140px;flex:none;height:28px}
@media (max-width:700px){.zctl input[type=range]{display:none}}
#busy{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font:800 16px Inter,sans-serif}
#busy.on{display:flex}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span class="wm">undiagnosed<em>*</em><span class="mg"> magazine</span></span><small>*for now</small></a>
  <div style="display:flex;gap:8px">
    <button class="hbtn" id="openNotes" type="button">Notes</button>
    <button class="hbtn" id="openToc" type="button">Contents</button>
    <a class="hbtn" href="/" style="display:inline-flex;align-items:center;text-decoration:none">Home</a>
  </div>
</header>
<main id="stage">
  <div id="track"></div>
  <button class="nav" id="prev" type="button" aria-label="Previous page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="nav" id="next" type="button" aria-label="Next page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="zv" aria-label="Zoomed page"><div class="zin" id="zin"></div></div>
  <div class="zctl" id="zctl" role="group" aria-label="Zoom"><button type="button" id="zout" aria-label="Zoom out">−</button><span class="zl" id="zlvl">120%</span><input type="range" id="zrange" min="100" max="300" step="10" value="120" aria-label="Zoom level"><button type="button" id="zinb" aria-label="Zoom in">+</button><button type="button" class="zd" id="zdone">Done</button></div>
  <div id="hint">Swipe to turn the page. Pinch or double tap to zoom.</div>

<script>

(function(){
var N=163, W=1080, H=1440, cur=1, spread=false, slots=[], busy=false;
var track=document.getElementById('track'), stage=document.getElementById('stage');

function pad(n){return ('00'+n).slice(-3)}
var BASE=location.pathname.replace(/\/(index\.html)?$/,'')+'/';

function ui(){

function go(dir){

// notes
var KEY='und-issue1-notes', notes=[], pending=null;

document.getElementById('openNotes').onclick=openNotes;

var COLORS=['#FFE45C','#FF9EC7','#8FD3FF','#A8E6A1','#FFB26B'], CNAMES=['Yellow','Pink','Blue','Green','Orange'];

  return true}

function drawSticky(ctx,x){var sw=Math.max(110,Math.min(W*.8,x.w?x.w*W:W*.34)),sh=sw*.92,px=x.x*W,py=x.y*H;

var Z=1, zv=document.getElementById('zv'), zin=document.getElementById('zin'), zctl=document.getElementById('zctl');

  var lt=0;t.addEventListener('touchend',function(e){if(e.touches.length||e.changedTouches.length!==1)return;var n=Date.now();if(n-lt<320){lt=0;setZoom(Z>=2.5?1.2:Z+.5)}else lt=n});
